<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Footer Omnicanal</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link rel="stylesheet" href="base.css" />
<script>if (location.search.includes("white")) document.documentElement.classList.add("white");</script>
<style>
  .chip2 { display: flex; align-items: center; gap: 18px; padding: 16px 20px 16px 16px; font-weight: 700; font-size: 27px; letter-spacing: -0.01em; border-radius: 999px; white-space: nowrap; }
  .chip2 .check { margin-left: auto; }
  .flow { display: flex; align-items: center; justify-content: space-between; margin-top: 18px; }
  .flow .c { width: 64px; height: 64px; border-radius: 50%; background: var(--blue-light); color: var(--blue); border: 2px solid rgba(2,99,226,.12); display: flex; align-items: center; justify-content: center; font-size: 26px; }
  .flow .c.on { background: var(--blue); color: #fff; border-color: var(--blue); }
  .flow .a { color: var(--soft); font-size: 18px; }
</style>
</head>
<body>
<div class="canvas" style="width:1400px;height:1320px">

  <svg class="abs" style="left:0;top:0;z-index:1" width="1400" height="1320" fill="none" stroke="#0263e2" stroke-width="3">
    <path d="M1245 562 V800" />
  </svg>

  <img class="person" src="../fotos/recortes/omni-footer.png" style="left:340px;top:60px;width:720px;--fade-start:70%;--fade-end:94%" alt="" />

  <!-- Izquierda -->
  <div class="card chip2" style="left:30px;top:380px;width:370px"><div class="ico md"><i class="fa-solid fa-layer-group"></i></div>Unifica<div class="check"><i class="fa-solid fa-check"></i></div></div>
  <div class="card chip2" style="left:30px;top:505px;width:370px"><div class="ico md"><i class="fa-solid fa-route"></i></div>Enruta<div class="check"><i class="fa-solid fa-check"></i></div></div>
  <div class="card chip2" style="left:30px;top:630px;width:370px"><div class="ico md"><i class="fa-solid fa-circle-check"></i></div>Resuelve<div class="check"><i class="fa-solid fa-check"></i></div></div>

  <!-- Izquierda abajo: FCR -->
  <div class="card" style="left:40px;top:830px;width:470px;padding:28px 32px 22px;border-radius:32px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
      <div class="t-title" style="font-size:24px">Resolución al 1er contacto</div>
      <div class="ico light sm"><i class="fa-solid fa-arrow-trend-up" style="font-size:22px"></i></div>
    </div>
    <svg width="406" height="170" viewBox="0 0 406 170">
      <g fill="#0263e2">
        <rect x="8"   y="120" width="38" height="50" rx="10" fill="#bcd5fb"/>
        <rect x="66"  y="104" width="38" height="66" rx="10" fill="#8ab4f8"/>
        <rect x="124" y="92"  width="38" height="78" rx="10" fill="#5b9bf3"/>
        <rect x="182" y="72"  width="38" height="98" rx="10" fill="#3b8bf5"/>
        <rect x="240" y="56"  width="38" height="114" rx="10"/>
        <rect x="298" y="36"  width="38" height="134" rx="10"/>
        <rect x="356" y="16"  width="38" height="154" rx="10" fill="#1e2a8a"/>
      </g>
    </svg>
  </div>

  <!-- Derecha arriba: CSAT -->
  <div class="card" style="left:1110px;top:380px;width:270px;padding:26px 24px 24px;border-radius:32px;text-align:center">
    <div style="font-weight:800;font-size:52px;letter-spacing:-.03em;color:#0f172a;line-height:1">4.8</div>
    <div style="color:#f0ad0f;font-size:24px;margin:10px 0 10px;letter-spacing:4px"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star-half-stroke"></i></div>
    <div class="t-title" style="font-size:22px">CSAT del cliente</div>
  </div>

  <!-- Derecha abajo: experiencia continua -->
  <div class="card" style="left:960px;top:800px;width:420px;padding:26px 28px 28px;border-radius:32px">
    <div class="t-title" style="font-size:24px">Experiencia continua</div>
    <div class="t-sub" style="font-size:17px;margin-top:4px">Sin repetir la solicitud</div>
    <div class="flow">
      <div class="c"><i class="fa-brands fa-whatsapp"></i></div><i class="fa-solid fa-chevron-right a"></i>
      <div class="c"><i class="fa-solid fa-comment-dots"></i></div><i class="fa-solid fa-chevron-right a"></i>
      <div class="c on"><i class="fa-solid fa-phone"></i></div>
    </div>
  </div>
</div>
</body>
</html>
