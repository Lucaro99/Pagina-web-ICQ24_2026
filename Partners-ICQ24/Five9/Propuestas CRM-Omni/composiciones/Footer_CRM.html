<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Footer CRM Integrations</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link rel="stylesheet" href="base.css" />
<script>if (location.search.includes("white")) document.documentElement.classList.add("white");</script>
<style>
  .chip2 { display: flex; align-items: center; gap: 18px; padding: 16px 20px 16px 16px; font-weight: 700; font-size: 26px; letter-spacing: -0.01em; border-radius: 999px; white-space: nowrap; }
  .chip2 .check { margin-left: auto; }
  .log { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 2px solid #f1f5f9; font-size: 19px; font-weight: 600; color: var(--text); }
  .log:last-child { border-bottom: 0; padding-bottom: 0; }
  .log .check { width: 34px; height: 34px; font-size: 16px; }
</style>
</head>
<body>
<div class="canvas" style="width:1400px;height:1320px">

  <svg class="abs" style="left:0;top:0;z-index:1" width="1400" height="1320" fill="none" stroke="#0263e2" stroke-width="3">
    <path d="M1230 300 V360" />
  </svg>

  <img class="person edges" src="../fotos/recortes/crm-footer.png" style="left:110px;top:300px;width:1250px;--fade-start:82%;--fade-end:96%;--edge-l:10%;--edge-r:3%" alt="" />

  <!-- Nodo -->
  <div class="node" style="left:1140px;top:120px;width:180px;height:180px;font-size:76px"><i class="fa-solid fa-arrows-rotate"></i></div>

  <!-- CRMs -->
  <div class="card chip2" style="left:30px;top:250px;width:370px"><div class="ico md"><i class="fa-solid fa-cloud"></i></div>Salesforce<div class="check"><i class="fa-solid fa-check"></i></div></div>
  <div class="card chip2" style="left:30px;top:370px;width:370px"><div class="ico md"><i class="fa-solid fa-circle-nodes"></i></div>HubSpot<div class="check"><i class="fa-solid fa-check"></i></div></div>
  <div class="card chip2" style="left:30px;top:490px;width:370px"><div class="ico md"><i class="fa-solid fa-table-cells-large"></i></div>Dynamics<div class="check"><i class="fa-solid fa-check"></i></div></div>
  <div class="card chip2" style="left:30px;top:610px;width:370px"><div class="ico md"><i class="fa-solid fa-cubes"></i></div>Odoo<div class="check"><i class="fa-solid fa-check"></i></div></div>

  <!-- Sincronizado -->
  <div class="card" style="left:1020px;top:360px;width:360px;padding:26px 28px 22px;border-radius:32px">
    <div class="t-title" style="font-size:23px;margin-bottom:6px">Sincronizado</div>
    <div class="log"><div class="check"><i class="fa-solid fa-check"></i></div>Llamada registrada</div>
    <div class="log"><div class="check"><i class="fa-solid fa-check"></i></div>Nota creada</div>
    <div class="log"><div class="check"><i class="fa-solid fa-check"></i></div>Caso actualizado</div>
  </div>

  <!-- Productividad -->
  <div class="card" style="left:30px;top:860px;width:470px;padding:28px 32px 22px;border-radius:32px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
      <div class="t-title" style="font-size:25px">Productividad</div>
      <div class="ico light sm"><i class="fa-solid fa-arrow-trend-up" style="font-size:22px"></i></div>
    </div>
    <svg width="406" height="170" viewBox="0 0 406 170">
      <defs><linearGradient id="pa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0263e2" stop-opacity=".22"/><stop offset="1" stop-color="#0263e2" stop-opacity="0"/></linearGradient></defs>
      <g stroke="#eef2f7" stroke-width="2"><line x1="0" y1="25" x2="406" y2="25"/><line x1="0" y1="85" x2="406" y2="85"/><line x1="0" y1="145" x2="406" y2="145"/></g>
      <path d="M0 140 C46 136 74 116 120 112 S194 90 240 76 S320 40 392 22 V170 H0Z" fill="url(#pa)"/>
      <path d="M0 140 C46 136 74 116 120 112 S194 90 240 76 S320 40 392 22" stroke="#0263e2" stroke-width="6" fill="none" stroke-linecap="round"/>
      <circle cx="392" cy="22" r="9" fill="#fff" stroke="#0263e2" stroke-width="6"/>
    </svg>
  </div>
</div>
</body>
</html>
