<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Hero WFM</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link rel="stylesheet" href="base.css" />
<script>if (location.search.includes("white")) document.documentElement.classList.add("white");</script>
</head>
<body>
<div class="canvas" style="width:1920px;height:1440px">

  <!-- Conectores -->
  <svg class="abs" style="left:0;top:0;z-index:1" width="1920" height="1440" fill="none" stroke="#0263e2" stroke-width="3">
    <path d="M470 220 H450 a60 60 0 0 0 -60 60 V440" />
    <path d="M390 770 V1000" />
  </svg>

  <!-- Persona -->
  <img class="person" src="../fotos/recortes/asesora-tablet.png" style="left:330px;top:40px;width:1170px;--fade-start:62%;--fade-end:90%" alt="" />

  <!-- Nodo: calendario inteligente -->
  <div class="node" style="left:470px;top:110px;width:220px;height:220px;font-size:100px">
    <i class="fa-solid fa-calendar-check"></i>
  </div>

  <!-- Forecast omnicanal -->
  <div class="card" style="left:90px;top:440px;width:600px;padding:36px 40px 30px">
    <div style="display:flex;align-items:center;gap:22px;margin-bottom:22px">
      <div class="ico light md"><i class="fa-solid fa-chart-line"></i></div>
      <div>
        <div class="t-title">Forecast omnicanal</div>
        <div class="t-sub" style="font-size:20px">Demanda prevista vs. real</div>
      </div>
    </div>
    <svg width="520" height="150" viewBox="0 0 520 150">
      <defs><linearGradient id="fa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0263e2" stop-opacity=".22"/><stop offset="1" stop-color="#0263e2" stop-opacity="0"/></linearGradient></defs>
      <g stroke="#e8eef8" stroke-width="2"><line x1="0" y1="20" x2="520" y2="20"/><line x1="0" y1="75" x2="520" y2="75"/><line x1="0" y1="130" x2="520" y2="130"/></g>
      <path d="M0 118 C40 110 60 70 100 66 S160 96 200 84 S260 30 300 28 S370 70 410 62 S480 40 520 46 V150 H0 Z" fill="url(#fa)"/>
      <path d="M0 118 C40 110 60 70 100 66 S160 96 200 84 S260 30 300 28 S370 70 410 62 S480 40 520 46" stroke="#0263e2" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M0 122 C40 112 60 78 100 72 S160 92 200 90 S260 38 300 36 S370 76 410 66 S480 46 520 50" stroke="#8ab4f8" stroke-width="4" stroke-dasharray="10 9" fill="none" stroke-linecap="round"/>
      <circle cx="300" cy="28" r="9" fill="#fff" stroke="#0263e2" stroke-width="5"/>
    </svg>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px">
      <div class="legend" style="font-size:16px"><span><i style="background:#0263e2"></i>Real</span><span><i style="background:#8ab4f8"></i>Forecast</span></div>
      <span class="pill-ui" style="font-size:17px">Precisión 96%</span>
    </div>
  </div>

  <!-- Adherencia -->
  <div class="card" style="left:1400px;top:830px;width:470px;padding:28px 32px">
    <div style="display:flex;align-items:center;gap:22px">
      <div class="ico md"><i class="fa-solid fa-user-clock"></i></div>
      <div style="flex:1">
        <div class="t-title" style="font-size:28px">Adherencia en tiempo real</div>
        <div style="display:flex;align-items:center;gap:18px;margin-top:16px">
          <div class="bar-track" style="flex:1"><div class="bar-fill" style="width:94%"></div></div>
          <div style="font-weight:800;font-size:30px;color:#0263e2;letter-spacing:-.02em">94%</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Chips derechos -->
  <div class="card chip" style="left:1400px;top:230px;width:420px"><div class="ico"><i class="fa-solid fa-chart-line"></i></div>Pronostica</div>
  <div class="card chip" style="left:1400px;top:420px;width:420px"><div class="ico"><i class="fa-solid fa-calendar-days"></i></div>Planifica</div>
  <div class="card chip" style="left:1400px;top:610px;width:420px"><div class="ico"><i class="fa-solid fa-sliders"></i></div>Controla</div>

  <!-- Cobertura por franja -->
  <div class="card" style="left:150px;top:1000px;width:540px;padding:32px 36px 28px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
      <div>
        <div class="t-title" style="font-size:26px">Cobertura por franja</div>
        <div class="t-sub" style="font-size:18px">Agentes vs. demanda</div>
      </div>
      <div class="ico light sm"><i class="fa-solid fa-arrow-up-right-from-square" style="font-size:20px"></i></div>
    </div>
    <svg width="468" height="170" viewBox="0 0 468 170">
      <line x1="0" y1="168" x2="468" y2="168" stroke="#cbd5e1" stroke-width="3"/>
      <g fill="#0263e2">
        <rect x="8"   y="110" width="44" height="58" rx="12" fill="#8ab4f8"/>
        <rect x="68"  y="78"  width="44" height="90" rx="12" fill="#5b9bf3"/>
        <rect x="128" y="44"  width="44" height="124" rx="12"/>
        <rect x="188" y="20"  width="44" height="148" rx="12" fill="#1e2a8a"/>
        <rect x="248" y="38"  width="44" height="130" rx="12"/>
        <rect x="308" y="70"  width="44" height="98" rx="12" fill="#5b9bf3"/>
        <rect x="368" y="96"  width="44" height="72" rx="12" fill="#8ab4f8"/>
        <rect x="428" y="118" width="36" height="50" rx="12" fill="#bcd5fb"/>
      </g>
      <path d="M30 104 C80 86 120 40 210 18 S330 64 446 112" stroke="#f0ad0f" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="2 12"/>
    </svg>
  </div>
</div>
</body>
</html>
